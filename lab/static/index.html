<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pwnsat Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topbar">
  <span class="brand">PWNSAT LAB</span>
  <span class="logochip" title="GSpace"><img src="gspace-logo.png" alt="GSpace"></span>
  <span class="stat" data-i18n="session">Session</span><span class="stat"><b id="sid">—</b></span>
  <span class="stat" data-i18n="link">Secure link</span><span class="pill off" id="linkpill">OFF</span>
  <span class="stat" data-i18n="mode">Mode</span><span class="stat"><b id="modeval">—</b></span>
  <span class="stat" data-i18n="exercise">Exercise</span><span class="stat"><b id="exval">—</b></span>
  <span class="spacer"></span>
  <button id="themetoggle" class="iconbtn" title="Theme">◐</button>
  <button id="wikitoggle" data-i18n="wiki">Wiki</button>
  <button id="resetbtn" data-i18n="reset">Reset satellite</button>
  <a href="instructor.html" target="_blank"><button id="instbtn" data-i18n="instructor">Instructor</button></a>
  <select id="lang"><option value="en">English</option><option value="ja">日本語</option></select>
</div>

<div id="main">
  <aside id="wiki"></aside>
  <div id="center">
    <div id="analyzer">
      <div id="toolbar">
        <input id="filter" placeholder="filter: apid==0x0b  dir==rx  malformed  tc  tm">
        <button id="pausebtn" data-i18n="pause">Pause</button>
        <button id="clearcap" data-i18n="clear">Clear</button>
        <button id="exportcap" data-i18n="export">Export</button>
        <span class="count" id="capcount">0 packets</span>
      </div>
      <div id="panes">
        <div id="list"></div>
        <div id="detailwrap">
          <div id="tree"></div>
          <div id="hex"></div>
        </div>
      </div>
    </div>
    <div id="bottom">
      <div id="terminal">
        <div class="phead"><span data-i18n="terminal">Student terminal</span>
          <span class="spacer"></span><span class="txt">type 'help'</span></div>
        <div id="termout"></div>
        <div id="terminput"><span>pwnsat&gt;</span><input id="termin" autocomplete="off" autofocus></div>
      </div>
      <div id="console">
        <div class="phead"><span data-i18n="console">Satellite console</span>
          <span class="spacer"></span>
          <input id="consearch" placeholder="search">
          <button id="conclear" data-i18n="clear">Clear</button>
          <button id="conexport" data-i18n="export">Export</button></div>
        <div id="conout"></div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
